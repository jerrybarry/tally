name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Release macOS Apps
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run automated test suite
        run: npm test

      - name: Build macOS Apple Silicon (arm64)
        run: |
          npm run build:dmg:arm64
          cd dist && zip -r -y Tally-AppleSilicon-arm64.zip Tally-darwin-arm64/Tally.app && cd ..

      - name: Build macOS Intel (x64)
        run: |
          npm run build:dmg:x64
          cd dist && zip -r -y Tally-Intel-x64.zip Tally-darwin-x64/Tally.app && cd ..

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Tally-AppleSilicon-arm64.dmg
            dist/Tally-AppleSilicon-arm64.zip
            dist/Tally-Intel-x64.dmg
            dist/Tally-Intel-x64.zip
          generate_release_notes: true
